<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch demo</title>
    
    <style>
        table{
            border: 2px solid green;
            width: 80vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <th>sr no.</th>
            <th>title</th>
            <th>category</th>
            <th>rating</th>
            <th>price</th>
            <th>stock</th>
        </thead>
    
    <tbody id="data">
        
    </tbody>
    </table>

</body>
<script>
        const URL = "https://dummyjson.com/products?limit=5&skip=2";
        const el=document.getElementById("data");
        async function loadproduct() {
            try {
                const res = await fetch(URL);
                console.log("res=", res);
                const data = await res.json();
                console.log("data=", data.products);
            }
            catch (err) {
                console.log("error", err);
            }
        }
        loadproduct();
        let rows ="";
        data.products.map((i,index)=>(
            rows +=`
                <tr>
                    <td>${index}</td>
                    <td>${i.title}</td>
                    <td>${i.category}</td>
                    <td>${i.rating}</td>
                    <td>${i.price}</td>
                    <td>${i.stock}</td>
                </tr> `   
        ))
        el.innerHTML = rows;
    </script>

</html>
