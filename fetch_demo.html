<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: purple;
            background-color: red;
        }
        body{
            background-color: lightgreen;
        }
        table {
            width: 80vw;
            border: 2px solid green;
            margin: auto;
        }

        th,
        td {
            border: 2px solid rebeccapurple;
            padding: 10px;
            text-align: center;
        }
        th{
            background-color: aqua;
        }
        td{
            background-color: yellow;
        }
        button{
            background: pink;
        }
        button:hover{
            background: red;
        }
    </style>
    <script>
        let rate =0;
        async function getProducts() {
            const URL = "https://dummyjson.com/products?limit=10&skip=5";
            try {
                const res = await fetch(URL);
                console.log("res=", res);
                const data = await res.json();
                console.log("data=", data.products);
                let rows = "";
                data.products.map((i, index)=> (
                    rows += `
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><image src=" ${i.images[0]}" width ="100" height="100"></td>
                        <td>${i.category}</td>
                        <td>${i.rating}</td>
                        <td>${(i.price*rate).toFixed(2)}</td>
                        <td>${i.stock}</td>
                        <td><button type="submit">Add to cart</button></td>
                    </tr>`
                ))
                const el = document.getElementById("data");
                el.innerHTML =rows;
            }
            catch (err) {
                console.log("error", err);
            }
        }
        async function getrate(){
            const URL ="https://open.er-api.com/v6/latest/USD";
            try{
                const res = await fetch (URL);
                const ratedata = await  res.json();
                console.log("INR rate =",ratedata.rates.INR);
                return ratedata.rates.INR
            }
            catch(err){
                console.log(err);
            }
        }
        const test =async()=>{
            rate = await getrate();
        }
        test();
        getProducts();
    </script>
</head>

<body>
    <h1>
        <center>List of Products </center>
    </h1>
    <table>

        <thead>
            <tr>
                <th>Sr.NO</th>
                <th>Title</th>
                <th>Images</th>
                <th>category</th>
                <th>Rating</th>
                <th>Price(₹)</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>
</body>

</html>
